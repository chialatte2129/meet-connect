<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>CL97 視訊會議入口</title>
<style>
  :root { --bg:#f4f6fa; --fg:#1a2233; --btn:#1d6fe0; --btn-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#11151c; --fg:#eef1f6; --btn:#4a90f0; --btn-fg:#0b1220; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 0 0 28px; opacity: .75; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; max-width: 420px; min-height: 72px; border-radius: 16px;
    background: var(--btn); color: var(--btn-fg);
    font-size: 1.3rem; font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
  <h1>CL97 視訊會議</h1>
  <p>正在開啟會議⋯</p>
  <a id="go" class="btn" href="#">開啟會議</a>
<script>
  // 用法：index.html?room=CL97-2 ；未指定時預設 CL97-1
  var DEFAULT_ROOM = "CL97-1";
  var HOST = "meet-jp.ychkef.org";

  var room = new URLSearchParams(location.search).get("room") || DEFAULT_ROOM;
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(room)) room = DEFAULT_ROOM;

  // 手機/平板 → 開 Jitsi App；電腦 → 開網頁版
  var ua = navigator.userAgent;
  var isMobile = /Android|iPhone|iPad|iPod/i.test(ua) ||
                 (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS
  var url = (isMobile ? "org.jitsi.meet://" : "https://") + HOST + "/" + room;
  document.getElementById("go").href = url;
  location.replace(url);
</script>
</body>
</html>
